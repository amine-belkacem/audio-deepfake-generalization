[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adg"
version = "0.0.1"
description = "Audio deepfake detection on ASVspoof 2019 LA: LFCC vs. wav2vec 2.0, with unseen-attack, silence-shortcut and telephone-channel tests."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amine Belkacem" }]
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
